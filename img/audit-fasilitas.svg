<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="auditTitle">
  <title id="auditTitle">Audit fasilitas produksi oleh tim Signature Halal</title>
  <defs>
    <linearGradient id="auditBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="auditGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e2bb"/>
      <stop offset="50%" stop-color="#d9b877"/>
      <stop offset="100%" stop-color="#ad8442"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#auditBg)"/>
  <circle cx="660" cy="90" r="220" fill="rgba(217,184,119,0.06)"/>
  <circle cx="70" cy="540" r="160" fill="rgba(217,184,119,0.05)"/>

  <!-- Factory / facility silhouette -->
  <g fill="none" stroke="url(#auditGold)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M150 430 L150 300 L230 340 L230 270 L310 320 L310 260 L400 300 L400 430 Z" fill="rgba(245,241,232,0.04)"/>
    <rect x="150" y="430" width="250" height="20" fill="rgba(245,241,232,0.04)"/>
    <rect x="180" y="360" width="30" height="40" rx="3"/>
    <rect x="240" y="360" width="30" height="40" rx="3"/>
    <rect x="320" y="360" width="30" height="40" rx="3"/>
    <path d="M330 260 L330 220" />
    <circle cx="330" cy="210" r="10"/>
  </g>

  <!-- Clipboard with checklist -->
  <g transform="translate(430,190)">
    <rect x="0" y="0" width="190" height="240" rx="14" fill="#1a1815" stroke="url(#auditGold)" stroke-width="4"/>
    <rect x="55" y="-16" width="80" height="30" rx="8" fill="url(#auditGold)"/>
    <g stroke="rgba(245,241,232,0.5)" stroke-width="3" stroke-linecap="round">
      <line x1="28" y1="60" x2="162" y2="60"/>
      <line x1="28" y1="90" x2="162" y2="90"/>
      <line x1="28" y1="120" x2="140" y2="120"/>
    </g>
    <g stroke="url(#auditGold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M28 158 L45 176 L80 140"/>
    </g>
    <line x1="28" y1="200" x2="162" y2="200" stroke="rgba(245,241,232,0.35)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(540,380)" fill="none" stroke="url(#auditGold)" stroke-width="8" stroke-linecap="round">
    <circle cx="0" cy="0" r="46"/>
    <line x1="33" y1="33" x2="80" y2="80"/>
  </g>

  <text x="60" y="540" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" fill="#f5f1e8">Audit Fasilitas Produksi</text>
</svg>
