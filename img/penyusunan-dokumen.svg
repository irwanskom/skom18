<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="dokTitle">
  <title id="dokTitle">Penyusunan dokumen Sistem Jaminan Produk Halal (SJPH)</title>
  <defs>
    <linearGradient id="dokBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="dokGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e2bb"/>
      <stop offset="50%" stop-color="#d9b877"/>
      <stop offset="100%" stop-color="#ad8442"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dokBg)"/>
  <circle cx="640" cy="120" r="210" fill="rgba(217,184,119,0.06)"/>
  <circle cx="100" cy="520" r="170" fill="rgba(217,184,119,0.05)"/>

  <!-- Desk -->
  <rect x="90" y="420" width="620" height="16" rx="4" fill="rgba(245,241,232,0.06)"/>

  <!-- Stacked documents -->
  <g stroke="url(#dokGold)" stroke-width="3.5" fill="#1a1815">
    <rect x="190" y="330" width="180" height="90" rx="8"/>
    <rect x="210" y="300" width="180" height="90" rx="8"/>
    <rect x="230" y="270" width="180" height="90" rx="8" fill="rgba(217,184,119,0.1)"/>
  </g>
  <g stroke="rgba(245,241,232,0.5)" stroke-width="3" stroke-linecap="round">
    <line x1="252" y1="300" x2="388" y2="300"/>
    <line x1="252" y1="320" x2="368" y2="320"/>
    <line x1="252" y1="340" x2="388" y2="340"/>
  </g>

  <!-- Laptop -->
  <g transform="translate(440,300)">
    <rect x="0" y="0" width="220" height="130" rx="10" fill="#1a1815" stroke="url(#dokGold)" stroke-width="4"/>
    <rect x="16" y="16" width="188" height="98" rx="4" fill="rgba(217,184,119,0.08)"/>
    <g stroke="rgba(245,241,232,0.5)" stroke-width="3" stroke-linecap="round">
      <line x1="34" y1="40" x2="150" y2="40"/>
      <line x1="34" y1="58" x2="180" y2="58"/>
      <line x1="34" y1="76" x2="130" y2="76"/>
    </g>
    <path d="M-14 130 L234 130 L250 160 L-30 160 Z" fill="#242019" stroke="url(#dokGold)" stroke-width="3"/>
  </g>

  <!-- Pen -->
  <g transform="translate(150,400) rotate(-30)" stroke="url(#dokGold)" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="90" y2="0"/>
    <path d="M90 0 L104 -6 L104 6 Z" fill="url(#dokGold)"/>
  </g>

  <text x="60" y="540" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" fill="#f5f1e8">Penyusunan Dokumen SJPH</text>
</svg>
