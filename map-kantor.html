<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokasi kantor — Signature Halal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;background:#f4f1ea;font-family:'Public Sans',system-ui,sans-serif}
#map{height:100%;width:100%}
.leaflet-container{background:#e9e6df}
.leaflet-popup-content{font:400 12.5px/1.5 system-ui,sans-serif;color:#191713;margin:12px 14px}
.leaflet-popup-content b{font-weight:600}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<script>
var office = [-6.18690, 106.82320];
var map = L.map('map', { scrollWheelZoom: false }).setView(office, 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
L.circleMarker(office, {
  radius: 9, color: '#1f5c46', weight: 3, fillColor: '#1f5c46', fillOpacity: 0.85
}).addTo(map).bindPopup(
  '<b>PT Signature Halal Indonesia</b><br>Gedung Jaya, Jl. M.H. Thamrin No.12<br>Kb. Sirih, Menteng, Jakarta Pusat'
).openPopup();
</script>
</body>
</html>
