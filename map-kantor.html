<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokasi Kantor — Signature Halal</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --black-950: #0a0908;
    --black-800: #1a1815;
    --line: rgba(245,241,232,0.1);
    --gold-400: #d9b877;
    --grad-gold: linear-gradient(135deg, #f3e2bb 0%, #d9b877 50%, #ad8442 100%);
    --cream: #f5f1e8;
    --cream-dim: #b6ad9e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--black-950); color: var(--cream-dim);
  }
  .map-wrap { display: flex; flex-direction: column; height: 100%; }
  .map-card {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 20px; background: var(--black-800); border-bottom: 1px solid var(--line);
  }
  .map-card .ic {
    flex: none; width: 40px; height: 40px; border-radius: 10px;
    background: var(--black-950); border: 1px solid var(--line);
    color: var(--gold-400); display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .map-card h1 { font-size: 14px; font-weight: 600; color: var(--cream); margin: 0 0 3px; }
  .map-card p { font-size: 12.5px; line-height: 1.5; margin: 0; }
  .map-card a.directions {
    margin-left: auto; flex: none; align-self: center;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--grad-gold); color: #0a0908; text-decoration: none;
    font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 20px; white-space: nowrap;
  }
  iframe { flex: 1; width: 100%; border: 0; display: block; filter: grayscale(0.15) contrast(1.05); }
</style>
</head>
<body>
  <div class="map-wrap">
    <div class="map-card">
      <div class="ic"><i class="fa-solid fa-location-dot"></i></div>
      <div>
        <h1>Kantor Signature Halal</h1>
        <p>Jl. Kramat Raya No. 164, RT.7/RW.2, Kenari, Kec. Senen, Jakarta Pusat, DKI Jakarta 10430</p>
      </div>
      <a class="directions" href="https://www.google.com/maps/dir/?api=1&destination=Jl.+Kramat+Raya+No.+164,+Kenari,+Kec.+Senen,+Jakarta+Pusat,+DKI+Jakarta+10430" target="_blank" rel="noopener">
        <i class="fa-solid fa-diamond-turn-right"></i> Rute
      </a>
    </div>
    <iframe
      src="https://www.google.com/maps?q=Jl.+Kramat+Raya+No.+164,+Kenari,+Kec.+Senen,+Jakarta+Pusat,+DKI+Jakarta+10430&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="Peta lokasi kantor Signature Halal"></iframe>
  </div>
</body>
</html>
