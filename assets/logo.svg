<svg width="200" height="240" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5da8a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a97c1f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132"/>
      <stop offset="55%" stop-color="#1f8a53"/>
      <stop offset="100%" stop-color="#2fae6d"/>
    </linearGradient>
  </defs>

  <!-- outer arch -->
  <path d="M20 118 C20 55 55 8 100 8 C145 8 180 55 180 118"
        fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- side notches -->
  <path d="M20 118 C20 132 30 142 46 142 L74 142" fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M180 118 C180 132 170 142 154 142 L126 142" fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- inner capsule (mic body) -->
  <rect x="72" y="40" width="56" height="120" rx="28" fill="url(#greenGrad)"/>
  <rect x="72" y="40" width="56" height="120" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- leaf blade in center -->
  <path d="M100 55 C112 80 112 120 100 148 C88 120 88 80 100 55 Z" fill="#0b3d2e"/>
  <path d="M100 55 L100 148" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- infinity swirl tail -->
  <path d="M100 160 C100 175 78 178 78 195 C78 212 100 214 100 197 C100 214 122 212 122 195 C122 178 100 175 100 160 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
